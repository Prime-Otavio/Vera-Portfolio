<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; background:#fff; font-family:sans-serif; padding:40px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:24px; }
  .cell { border:1px solid #E5E7EB; border-radius:12px; padding:20px; text-align:center; }
  .cell svg { width:130px; height:130px; }
  .cell p { margin-top:10px; font-size:14px; color:#003B8E; font-weight:700; }
  h2 { color:#003B8E; margin:24px 0 12px; }
</style>
</head>
<body>

<!-- ============ SYMBOL LIBRARY ============ -->
<svg width="0" height="0" style="position:absolute">
  <defs>

    <!-- SOUND / VIBRAÇÃO -->
    <symbol id="ic-sound" viewBox="0 0 120 120">
      <g fill="none" stroke="#003B8E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 48 H40 L60 30 V90 L40 72 H22 Z"/>
      </g>
      <g fill="none" stroke="#1E88E5" stroke-width="5" stroke-linecap="round">
        <path d="M74 46 Q83 60 74 74"/>
        <path d="M86 38 Q101 60 86 82"/>
      </g>
    </symbol>

    <!-- MANÔMETRO / PRESSÃO -->
    <symbol id="ic-gauge" viewBox="0 0 120 120">
      <g fill="none" stroke="#003B8E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="60" cy="62" r="36"/>
        <line x1="60" y1="30" x2="60" y2="38"/>
        <line x1="92" y1="62" x2="84" y2="62"/>
        <line x1="28" y1="62" x2="36" y2="62"/>
        <line x1="83" y1="39" x2="77" y2="45"/>
        <line x1="37" y1="39" x2="43" y2="45"/>
      </g>
      <line x1="60" y1="62" x2="80" y2="44" stroke="#1E88E5" stroke-width="6" stroke-linecap="round"/>
      <circle cx="60" cy="62" r="6" fill="#003B8E"/>
    </symbol>

    <!-- GOTA / VAZAMENTO -->
    <symbol id="ic-drop" viewBox="0 0 120 120">
      <path d="M60 20 C60 20 90 58 90 80 A30 30 0 0 1 30 80 C30 58 60 20 60 20 Z"
            fill="none" stroke="#003B8E" stroke-width="5" stroke-linejoin="round"/>
      <path d="M48 80 a12 12 0 0 0 9 11" fill="none" stroke="#1E88E5" stroke-width="5" stroke-linecap="round"/>
    </symbol>

    <!-- CANETA ALTA ROTAÇÃO + CALOR -->
    <symbol id="ic-handpiece" viewBox="0 0 120 120">
      <g fill="none" stroke="#003B8E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <!-- corpo angulado -->
        <path d="M40 92 L86 46 a9 9 0 0 0 0-13 l-1-1 a9 9 0 0 0-13 0 L26 78"/>
        <path d="M40 92 L26 78"/>
        <!-- cabeça -->
        <circle cx="33" cy="85" r="11"/>
        <!-- broca -->
        <line x1="33" y1="96" x2="33" y2="108"/>
      </g>
      <!-- ondas de calor -->
      <g fill="none" stroke="#1E88E5" stroke-width="4.5" stroke-linecap="round">
        <path d="M80 18 q7 6 0 13"/>
        <path d="M94 14 q9 8 0 17"/>
      </g>
    </symbol>

    <!-- RAIO / ELÉTRICO -->
    <symbol id="ic-bolt" viewBox="0 0 120 120">
      <path d="M68 16 L34 66 H55 L50 104 L88 50 H64 Z"
            fill="#EFF6FF" stroke="#003B8E" stroke-width="5" stroke-linejoin="round"/>
    </symbol>

    <!-- CADEIRA ODONTOLÓGICA -->
    <symbol id="ic-chair" viewBox="0 0 120 120">
      <g fill="none" stroke="#003B8E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <!-- encosto -->
        <path d="M44 26 a8 8 0 0 1 16 0 V58 H44 Z"/>
        <!-- assento -->
        <path d="M40 58 H78 a6 6 0 0 1 6 6 v6 a6 6 0 0 1-6 6 H52"/>
        <!-- apoio pernas -->
        <path d="M52 76 l24 14"/>
        <!-- coluna -->
        <line x1="50" y1="76" x2="50" y2="96"/>
        <!-- base -->
        <path d="M36 100 H64"/>
        <!-- refletor -->
        <line x1="60" y1="30" x2="86" y2="22"/>
        <circle cx="92" cy="20" r="8"/>
      </g>
    </symbol>

    <!-- DENTE + ENGRENAGEM (marca) -->
    <symbol id="ic-toothgear" viewBox="0 0 120 120">
      <!-- dente -->
      <path d="M40 24 C30 24 24 32 24 44 C24 60 30 72 34 88 C36 96 44 96 45 88 L48 68 C48 64 54 64 54 68 L57 88 C58 96 66 96 68 88 C72 72 78 60 78 44 C78 32 72 24 62 24 C55 24 54 30 50 30 C46 30 47 24 40 24 Z"
            fill="none" stroke="#003B8E" stroke-width="5" stroke-linejoin="round"/>
      <!-- engrenagem pequena -->
      <g fill="none" stroke="#1E88E5" stroke-width="4" stroke-linejoin="round">
        <circle cx="86" cy="80" r="13"/>
        <circle cx="86" cy="80" r="5"/>
        <g stroke-linecap="round">
          <line x1="86" y1="62" x2="86" y2="67"/>
          <line x1="86" y1="93" x2="86" y2="98"/>
          <line x1="68" y1="80" x2="73" y2="80"/>
          <line x1="99" y1="80" x2="104" y2="80"/>
          <line x1="73" y1="67" x2="76" y2="70"/>
          <line x1="96" y1="90" x2="99" y2="93"/>
          <line x1="99" y1="67" x2="96" y2="70"/>
          <line x1="76" y1="90" x2="73" y2="93"/>
        </g>
      </g>
    </symbol>

    <!-- CHECK -->
    <symbol id="ic-check" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="44" fill="none" stroke="#22C55E" stroke-width="6"/>
      <path d="M40 62 L54 76 L82 46" fill="none" stroke="#22C55E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- CROSS -->
    <symbol id="ic-cross" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="44" fill="none" stroke="#EF4444" stroke-width="6"/>
      <path d="M44 44 L76 76 M76 44 L44 76" fill="none" stroke="#EF4444" stroke-width="7" stroke-linecap="round"/>
    </symbol>

    <!-- TAP / DEDO (CTA) -->
    <symbol id="ic-tap" viewBox="0 0 120 120">
      <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M52 56 V36 a8 8 0 0 1 16 0 v28"/>
        <path d="M68 52 a7 7 0 0 1 14 0 v6"/>
        <path d="M82 56 a7 7 0 0 1 12 0 v8"/>
        <path d="M52 60 l-10 6 a8 8 0 0 0-3 11 l10 18 a14 14 0 0 0 12 7 h16 a14 14 0 0 0 14-13 l1-31"/>
      </g>
    </symbol>

    <!-- PIN LOCALIZAÇÃO -->
    <symbol id="ic-pin" viewBox="0 0 120 120">
      <path d="M60 20 a26 26 0 0 1 26 26 c0 20-26 48-26 48 S34 66 34 46 A26 26 0 0 1 60 20 Z"
            fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="60" cy="46" r="9" fill="none" stroke="currentColor" stroke-width="6"/>
    </symbol>

    <!-- COMPRESSOR -->
    <symbol id="ic-compressor" viewBox="0 0 120 120">
      <g fill="none" stroke="#003B8E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="26" y="50" width="56" height="34" rx="6"/>
        <circle cx="44" cy="67" r="9"/>
        <line x1="60" y1="58" x2="76" y2="58"/>
        <line x1="60" y1="67" x2="76" y2="67"/>
        <path d="M82 58 h10 v-18 a6 6 0 0 0-6-6 h-4"/>
        <line x1="34" y1="84" x2="34" y2="92"/>
        <line x1="74" y1="84" x2="74" y2="92"/>
      </g>
    </symbol>

    <!-- AUTOCLAVE -->
    <symbol id="ic-autoclave" viewBox="0 0 120 120">
      <g fill="none" stroke="#003B8E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="28" y="30" width="64" height="60" rx="8"/>
        <circle cx="60" cy="60" r="17"/>
        <circle cx="60" cy="60" r="6"/>
        <line x1="36" y1="90" x2="36" y2="96"/>
        <line x1="84" y1="90" x2="84" y2="96"/>
      </g>
    </symbol>

  </defs>
</svg>

<h2>Ícones de sinais (carrossel)</h2>
<div class="grid">
  <div class="cell"><svg><use href="#ic-sound"/></svg><p>Barulho/vibração</p></div>
  <div class="cell"><svg><use href="#ic-gauge"/></svg><p>Pressão/manômetro</p></div>
  <div class="cell"><svg><use href="#ic-drop"/></svg><p>Vazamento</p></div>
  <div class="cell"><svg><use href="#ic-handpiece"/></svg><p>Caneta + calor</p></div>
  <div class="cell"><svg><use href="#ic-bolt"/></svg><p>Elétrico/raio</p></div>
  <div class="cell"><svg><use href="#ic-chair"/></svg><p>Cadeira</p></div>
  <div class="cell"><svg><use href="#ic-toothgear"/></svg><p>Dente+engrenagem</p></div>
  <div class="cell"><svg><use href="#ic-compressor"/></svg><p>Compressor</p></div>
</div>

<h2>Utilitários</h2>
<div class="grid">
  <div class="cell"><svg><use href="#ic-autoclave"/></svg><p>Autoclave</p></div>
  <div class="cell"><svg><use href="#ic-check"/></svg><p>Check</p></div>
  <div class="cell"><svg><use href="#ic-cross"/></svg><p>Cross</p></div>
  <div class="cell" style="color:#003B8E"><svg><use href="#ic-tap"/></svg><p>Tap (CTA)</p></div>
  <div class="cell" style="color:#003B8E"><svg><use href="#ic-pin"/></svg><p>Pin local</p></div>
</div>

</body>
</html>
